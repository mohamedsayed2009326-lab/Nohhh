
name: Inspect ZIP Project

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install unzip
        run: sudo apt-get update && sudo apt-get install -y unzip

      - name: Extract and Inspect
        run: |
          mkdir -p extracted

          ZIP=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "ZIP NOT FOUND"
            echo "Repository files:"
            find . -maxdepth 5 -type f \
              -not -path "./.git/*" | head -n 200
            exit 1
          fi

          echo "ZIP FOUND: $ZIP"
          unzip -q "$ZIP" -d extracted

          echo "========== PROJECT FILES =========="
          find extracted -maxdepth 6 -type f \
            | sort | head -n 300

          echo "========== PROJECT TYPES =========="
          find extracted -type f \
            \( -name "package.json" \
            -o -name "index.html" \
            -o -name "build.gradle" \
            -o -name "settings.gradle" \
            -o -name "gradlew" \
            -o -name "AndroidManifest.xml" \
            -o -name "pubspec.yaml" \) \
            | sort
