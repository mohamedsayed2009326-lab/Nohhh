
name: Inspect Abu Sabra Project

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  inspect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect Repository and ZIP
        run: |
          echo "========== REPOSITORY FILES =========="
          find . -maxdepth 4 -type f \
            -not -path "./.git/*" | sort | head -n 250

          echo "========== ZIP FILES =========="
          find . -type f -iname "*.zip" \
            -not -path "./.git/*"

          ZIP_FILE=$(find . -type f -iname "*.zip" \
            -not -path "./.git/*" | head -n 1)

          if [ -n "$ZIP_FILE" ]; then
            echo "========== ZIP CONTENTS =========="
            unzip -l "$ZIP_FILE" | head -n 200

            mkdir -p extracted
            unzip -q "$ZIP_FILE" -d extracted

            echo "========== EXTRACTED FILES =========="
            find extracted -maxdepth 5 -type f \
              | sort | head -n 250
          fi

          echo "========== PROJECT CONFIG =========="
          find . extracted -type f \
            \( -name "package.json" \
            -o -name "index.html" \
            -o -name "capacitor.config.*" \
            -o -name "build.gradle" \
            -o -name "settings.gradle" \) \
            -not -path "./.git/*" 2>/dev/null | sort
